name: ci

on:
  push:
    branches: [main]
  # A draft pull request runs nothing; marking it ready for review runs the
  # gates, and every later push to it runs them again.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  check:
    name: make check (Go ${{ matrix.go }}, ${{ matrix.postgres }}, ${{ matrix.redis }})
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.27.x"]
        # The oldest and newest community-supported PostgreSQL majors, pinned
        # to exact minors. The test helper defaults to the newest.
        postgres: ["postgres:15.19-alpine", "postgres:18.6-alpine"]
        # The Redis server the redisstore module's tests default to, paired with
        # each PostgreSQL entry rather than crossed with it: the oldest
        # supported Redis major beside the oldest PostgreSQL, the newest beside
        # the newest. The rate-limit conformance suite runs every supported
        # server (Redis 7, Redis 8, Valkey 8) in each job regardless; this only
        # moves the default the other Redis tests run against. Kept in step
        # with the image constants in test/testutils.go.
        include:
          - postgres: "postgres:15.19-alpine"
            redis: "redis:7.4.11-alpine"
          - postgres: "postgres:18.6-alpine"
            redis: "redis:8.10.2-alpine"
    env:
      SCRTY_TEST_POSTGRES_IMAGE: ${{ matrix.postgres }}
      SCRTY_TEST_REDIS_IMAGE: ${{ matrix.redis }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ matrix.go }}
      # Fails fast, before the long gates, when a workflow references an action
      # by a tag, a branch or a short SHA. Also part of `make check`.
      - name: Check action pins
        run: make pincheck
      - name: Run gates
        run: make check
