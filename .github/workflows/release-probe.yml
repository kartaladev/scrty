name: release-probe

# Two triggers. A pushed root release tag starts it; nested module tags such as
# store/pgxstore/v0.1.0 begin with their directory and do not match. A manual
# dispatch with the version starts it too, because GitHub creates no push event
# when more than three tags are pushed at once, so a missed run can be started
# by hand. The version reaches the script only through the environment.
on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Published version to probe, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  probe:
    name: probe
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: false
      - name: probe the release from outside the repository
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: scripts/release-probe.sh "$VERSION"
