name: release-probe

# Runs after a release tag is pushed. Nested module tags such as
# store/pgxstore/v0.1.0 begin with their directory and do not match.
on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

jobs:
  probe:
    name: probe
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: false
      - name: probe the release from outside the repository
        env:
          REF_NAME: ${{ github.ref_name }}
        run: scripts/release-probe.sh "$REF_NAME"
